{% extends 'base.html' %}

{% load static %}

{% block dashboard %}
<div class="container-fluid">
  <div class="card card-primary">
    <div class="card-header">
      <h3 class="card-title">Novo Serviço</h3>
    </div>

    <!-- form start -->
    <form method="post">
      {% csrf_token %}
      <div class="card-body">
        <div class="form-group">
          <label for="unidade">Unidade</label>
          {{ form_servico.unidade }}
        </div>

        <div class="form-group">
          <label for="paciente">Paciente</label>
          {{ form_servico.paciente }}
        </div>

        <div class="form-group">
          <label for="regiao_servico">Região</label>
          {{ form_servico.regiao_servico }}
        </div>

      </div>

      <div class="card-footer">
        <button type="submit" class="btn btn-primary">Salvar</button>
        <a class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="{% static 'admin-lte/plugins/select2/js/select2.full.min.js' %}"></script>
<script>
  $(function () {
    $('.select2').select2()
  })
</script>
{% endblock %}

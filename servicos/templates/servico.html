{% extends 'base.html' %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'pacientes/css/pacientes.css' %}" />

{% endblock %}
{% block dashboard %}
<div class="container-fluid">
    <h2 class="text-center mb-4">Emissão de Relatórios de Vacinas Administradas</h2>
    
    <div class="text-center mb-4">
        <h4>Paciente: {{ servico.paciente }}</h4>
    </div>

    <h4 class="mb-3">Pré-visualização do Relatório</h4>
    <div class="card">
        <div class="card-header">
            <h3 class="card-title">Carteirinha de Vacinação</h3>
            <div class="card-tools">
                <span class="badge badge-primary">Visualização</span>
            </div>
        </div>
        <div class="card-body">
            <iframe 
                src="{% url 'gerar_carteira_vacinacao' servico.identificador %}" 
                width="100%" 
                height="600px" 
                style="border: 1px solid #ccc;">
            </iframe>
        </div>
        <div class="card-footer text-right">
            <a target="_blank" 
            href="{% url 'gerar_carteira_vacinacao' servico.identificador %}" 
            class="btn btn-primary">
                Baixar PDF
            </a>
        </div>
    </div>
</div>

{% endblock %}
